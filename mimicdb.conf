# MimicDB server config
# bind=127.0.0.1:9000
# storage_root=./data
# auth_db_path=./data/__auth__
# host_key_path=./data/__auth__/host_key
# session_idle_timeout_sec=900
# session_max_lifetime_sec=86400
# auth_rate_limit_burst=3
# auth_rate_limit_backoff_sec=30,60,120,240,480
flush_on_shutdown=false
flush_on_seal=true
flush_interval_ms=0
max_payload_bytes=268435456
max_rows_per_batch=5000000
append_sleep_ms=0
segment_cache_max=2
segment_cache_bytes=21474836480
query_threads=16
compression_enabled=true
compression_enable_dict=true
compression_enable_bitpack=true
compression_enable_fordelta=true
compression_enable_lz4=true
compression_min_segment_rows=4096
compression_min_ratio=1.1
